services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      - EXTRACTOR=tesseract
      - MAX_UPLOAD_MB=10
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  frontend:
    build: ./frontend
    ports:
      - "4200:80"
    depends_on:
      backend:
        condition: service_healthy
