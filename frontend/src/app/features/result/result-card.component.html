<section class="result-card">
  <div class="result-card__overall" [attr.data-color]="overallColor() ?? 'unknown'">
    <span class="result-card__overall-dot" aria-hidden="true"></span>
    <span class="result-card__overall-label">{{ overallLabel() }}</span>
  </div>

  <dl class="result-card__fields">
    @for (name of fieldNames; track name) {
      <div class="result-card__field">
        <dt>{{ fieldLabels[name] }}</dt>
        <dd>
          @if (valueFor(name) !== null) {
            {{ valueFor(name) | number: '1.0-1' }} {{ unitFor(name) }}
          } @else {
            —
          }
        </dd>
      </div>
    }
  </dl>
</section>
