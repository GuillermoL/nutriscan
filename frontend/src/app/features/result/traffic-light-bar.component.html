<div class="bar-row">
  <span class="bar-row__label">{{ label() }}</span>

  <div class="bar" [class.bar--doubtful]="status() === 'doubtful'" [class.bar--not-found]="status() === 'not_found'">
    @if (status() !== 'not_found' && bands()) {
      <div class="bar__track">
        <span class="bar__segment" style="background: var(--status-good)" [style.left.%]="bands()!.green.left" [style.width.%]="bands()!.green.width"></span>
        <span class="bar__segment" style="background: var(--status-warning)" [style.left.%]="bands()!.amber.left" [style.width.%]="bands()!.amber.width"></span>
        <span class="bar__segment" style="background: var(--status-critical)" [style.left.%]="bands()!.red.left" [style.width.%]="bands()!.red.width"></span>
      </div>

      @if (markerLeft() !== null) {
        <span class="bar__marker" [style.left.%]="markerLeft()" [style.background]="markerColorVar()"></span>
      }
    }
  </div>

  <span class="bar-row__value">
    @if (value() !== null) {
      {{ value() }}&nbsp;{{ unit() }}
    } @else {
      —
    }
  </span>
</div>
